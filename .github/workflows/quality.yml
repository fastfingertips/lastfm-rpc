name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --dev
        
      - name: Ruff Lint
        run: uv run ruff check .
        
      - name: Ruff Format Check
        run: uv run ruff format --check .

  type-check:
    name: Type Check (Pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --dev

      - name: Pyright
        run: uv run pyright

  dead-code:
    name: Dead Code (Vulture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --dev

      - name: Vulture
        run: uv run vulture src main.py --min-confidence 80

  translations:
    name: Translation Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --dev

      - name: Check Translations
        run: uv run python tools/check_translations.py
