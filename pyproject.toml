[project]
name = "lastfm-rpc"
version = "0.1.2"
description = "A localized Discord Rich Presence client for Last.fm, providing real-time music status and custom statistics."
authors = [
    { name = "fastfingertips", email = "fastfingertips@gmail.com" }
]
dependencies = [
    "loguru>=0.7.3",
    "packaging>=26.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pylast>=7.0.2",
    "pypresence>=4.6.1",
    "pystray>=0.19.5",
    "customtkinter>=5.2.2",
    "pyyaml>=6.0.3",
    "scrapling[all]>=0.4.1",
    "curl-cffi>=0.14.0",
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["lastfm", "discord", "rpc", "rich-presence", "music", "tracking", "localized"]

[project.urls]
Repository = "https://github.com/fastfingertips/lastfm-rpc"
Issues = "https://github.com/fastfingertips/lastfm-rpc/issues"

[project.scripts]
lastfm-rpc = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/constants", "src/core", "src/utils", "resources/translations", "resources/assets"]

[tool.uv]
managed = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "imageio>=2.37.2",
    "nuitka>=4.0.1",
    "pyright>=1.1.408",
    "ruff>=0.15.4",
    "vulture>=2.14",
    "zstandard>=0.25.0",
]

# ── Ruff (Linting + Formatting) ──────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "RET",  # flake8-return
    "PERF", # perflint
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "SIM108", # use ternary operator (readability preference)
    "N802",   # function name should be lowercase (RPC, GUI etc.)
    "N806",   # variable in function should be lowercase (RPC etc.)
    "RET504", # unnecessary assignment before return
]

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "utils", "constants"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]  # setup_logging() must run before imports

# ── Pyright (Type Checking) ──────────────────────────────
[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
extraPaths = ["src"]
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
exclude = [
    ".venv",
    "build.py",
    "dist",
    "__pycache__",
]

[tool.vulture]
min_confidence = 80
paths = ["src", "main.py"]
exclude = [".venv", "dist", "__pycache__"]
ignore_names = ["item"]  # pystray callbacks require (icon, item) signature
